# 3일 베타 설정. 경로는 이 파일 기준 상대경로.
seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  results_dir: results

kr3:
  # 전처리 전 원본(kr3_raw). 현재 HF 파일 목록에서는 지워졌지만 이 커밋에 남아 있음.
  url: https://huggingface.co/datasets/leey4n/KR3/resolve/b5ae506/kr3_raw.tsv
  filename: kr3_raw.tsv
  expected_rows: 642846

human:
  n_samples: 5000          # 사람 리뷰 수
  fewshot_pool_size: 2000  # 모방형(C) 프롬프트 예시용. 사람 데이터와 겹치지 않음
  min_chars: 5
  max_chars: 400
  length_edges: [20, 50, 150]   # <=20 / 21-50 / 51-150 / >150
  balance_bins: true            # 길이 구간마다 같은 수만큼 뽑기
  truncated_len_range: [190, 205]   # 이 길이에서 '...'로 끝나면 크롤링 미리보기로 잘린 리뷰로 보고 제외

generation:
  oversample: 1.2          # 길이 구간 맞추며 버려지는 분량 대비해서 더 생성
  prompt_types: [A, C]     # A=기본, C=실제 리뷰 문체 모방 (B=구어체 제약형도 정의돼 있음)
  fewshot_k: 4
  temperatures: [0.7, 1.0]
  max_retries: 6           # 429/5xx는 SDK가 지수 백오프로 재시도
  request_timeout: 60
  # 생성기 5개: 오픈 모델 3개(GPU 서버) + API 모델 2개(팀원).
  # 여러 사람이 나눠 생성해도 조건은 이 목록 전체로 한 번만 뽑아 공유합니다 (README "나눠서 생성").
  # 생성기를 빼거나 더하려면 조건을 뽑기 전에 바꾸세요.
  # family = 생성기 hold-out 단위. 같은 계열은 같은 family로 묶어야 "미학습"이 성립.
  #
  # 오픈 모델 실행 방법 두 가지 (model 이름이 서버에 떠 있는 이름과 같아야 생성이 진행됨):
  #   - llama.cpp (ppc64le, V100 등): bash scripts/generate_llamacpp.sh  -> gguf 파일 사용, --alias 로 model 이름을 맞춤
  #   - vLLM (x86 + compute capability 7.5 이상): bash scripts/generate_local.sh -> serve_args 사용
  # 포트는 생성기마다 달라서 GPU 두 장에 나눠 동시에 돌릴 수도 있습니다.
  generators:
    - name: qwen
      family: qwen          # Alibaba
      base_url: http://localhost:8001/v1
      model: Qwen/Qwen2.5-7B-Instruct
      gguf:                 # 공식 Q8_0 (3개로 나뉜 파일, 첫 파일을 지정하면 나머지는 자동으로 읽음)
        repo: Qwen/Qwen2.5-7B-Instruct-GGUF
        files: [qwen2.5-7b-instruct-q8_0-00001-of-00003.gguf, qwen2.5-7b-instruct-q8_0-00002-of-00003.gguf,
                qwen2.5-7b-instruct-q8_0-00003-of-00003.gguf]
      serve_args: [--max-model-len, "4096", --gpu-memory-utilization, "0.85"]
      concurrency: 16
      supports_temperature: true
      extra_body: {}
    - name: exaone
      family: exaone        # LG AI연구원 (비상업 라이선스)
      base_url: http://localhost:8002/v1
      model: LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct
      gguf:                 # 공식 Q8_0
        repo: LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct-GGUF
        files: [EXAONE-3.5-7.8B-Instruct-Q8_0.gguf]
      serve_args: [--max-model-len, "4096", --gpu-memory-utilization, "0.85", --trust-remote-code]
      concurrency: 16
      supports_temperature: true
      extra_body: {}
    - name: kanana
      family: kanana        # Kakao
      base_url: http://localhost:8003/v1
      model: kakaocorp/kanana-1.5-8b-instruct-2505
      gguf:                 # 공식 GGUF가 없어 카카오 원본을 Q8_0으로 변환한 DevQuasar 파일 사용 (보고서에 명시)
        repo: DevQuasar/kakaocorp.kanana-1.5-8b-instruct-2505-GGUF
        files: [kakaocorp.kanana-1.5-8b-instruct-2505.Q8_0.gguf]
      serve_args: [--max-model-len, "4096", --gpu-memory-utilization, "0.85"]
      concurrency: 16
      supports_temperature: true
      extra_body: {}
    # API 모델 (키는 .env). 모델 이름은 생성하는 사람이 현재 쓸 수 있는 것으로 바꿔도 됩니다 (조건과 무관).
    - name: gpt
      family: openai
      base_url: https://api.openai.com/v1
      model: gpt-4.1-mini
      api_key_env: OPENAI_API_KEY
      concurrency: 8
      supports_temperature: true
      extra_body: {}
    - name: gemini
      family: google
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: gemini-2.5-flash
      api_key_env: GEMINI_API_KEY
      concurrency: 4
      supports_temperature: true
      extra_body: {}

split:
  ratios: [0.7, 0.15, 0.15]   # train / val / test

eval:
  fpr_targets: [0.01, 0.05]
  prevalences: [0.01, 0.05, 0.10]   # 실제 LLM 리뷰 비율 가정
  n_bootstrap: 1000
  gate_min_chars: 51                # "50자 넘는 리뷰" 기준
  gates:                            # 결과 보기 전에 확정할 것
    ablation_auc_drop_max: 0.05
    logo_mean_auc_min: 0.85
    long_tpr_at_fpr05_min: 0.50

tfidf:
  analyzer: char_wb
  ngram_range: [2, 5]
  min_df: 2
  max_features: 300000
  C_grid: [0.3, 1.0, 3.0]

electra:
  model_name: beomi/KcELECTRA-base-v2022
  max_length: 256
  batch_size: 32
  lr: 5.0e-5
  epochs: 2
  warmup_ratio: 0.1
  weight_decay: 0.01

zeroshot:
  # 한국어가 되는 소형 오픈 LM. 생성기 qwen과 같은 계열이라 qwen 리뷰에 유리할 수 있으니 보고서에 적을 것.
  model_name: Qwen/Qwen2.5-1.5B
  max_length: 256
  batch_size: 4
